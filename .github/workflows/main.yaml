name: Fork security checks

on:
  push:
    branches: ['main', 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - name: Build and verify committed source
        run: python3 .github/ci/verify.py "$RUNNER_TEMP/forge-results"
      - name: Preserve bounded verification report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fork-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/forge-results/report.json
          if-no-files-found: error
          retention-days: 14
